{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="text-primary fw-bold">Debtors (Credit Sales)</h2>
    <span class="text-muted">Track Outstanding Payments</span>
</div>

<div class="row mb-4">
    <div class="col-md-4">
        <div class="card bg-light border-0 shadow-sm text-center p-3">
            <h6 class="text-muted">Total Outstanding</h6>
            <h3 class="fw-bold text-danger" id="totalOutstanding">0</h3>
        </div>
    </div>
</div>

<div class="card shadow-sm">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="bg-light">
                    <tr>
                        <th class="ps-3">Date</th>
                        <th>Invoice #</th>
                        <th>Customer</th>
                        <th>Outstanding</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="debtorTableBody">
                    <tr>
                        <td colspan="6" class="text-center py-4">Loading credit sales...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        fetchCreditSales();
    });

    async function fetchCreditSales() {
        try {
            // ?status=credit is what makes this a debtors list: SaleViewSet annotates
            // each sale with what has been paid and returns only those still short.
            // Fetching plain /api/sales/ listed every sale, settled ones included, and
            // totalled them all as "outstanding".
            const response = await fetch('/api/sales/?status=credit');
            const data = await response.json();
            renderTable(Array.isArray(data) ? data : (data.results || []));
        } catch (error) {
            console.error(error);
            document.getElementById('debtorTableBody').innerHTML =
                '<tr><td colspan="6" class="text-center py-4 text-danger">Failed to load debtors.</td></tr>';
        }
    }

    function renderTable(data) {
        const tbody = document.getElementById('debtorTableBody');
        tbody.innerHTML = '';
        let total = 0;

        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted">No records found</td></tr>';
            return;
        }

        data.forEach(s => {
            // The debt is what is still unpaid, not the invoice total.
            const owed = Number(s.balance != null ? s.balance : s.total_amount);
            total += owed;
            const paid = Number(s.amount_paid || 0);
            const customer = (s.customer_name || 'Walk-in').replace(/'/g, "\\'");

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="ps-3 text-muted">${new Date(s.created_at).toLocaleDateString()}</td>
                <td class="fw-bold">${s.invoice_number}</td>
                <td>${s.customer_name || 'Walk-in'}</td>
                <td>
                    <div class="fw-bold text-danger">${Math.round(owed).toLocaleString()}</div>
                    <div class="small text-muted">of ${Math.round(Number(s.total_amount)).toLocaleString()}
                        ${paid > 0 ? `· paid ${Math.round(paid).toLocaleString()}` : ''}</div>
                </td>
                <td><span class="badge bg-${paid > 0 ? 'info' : 'warning'} text-dark">
                    ${paid > 0 ? 'Part paid' : 'Unpaid'}</span></td>
                <td>
                    <button class="btn btn-sm btn-outline-primary" onclick="viewInvoice(${s.id})">View</button>
                    <button class="btn btn-sm btn-outline-success"
                            onclick="recordPayment(${s.id}, '${customer}', ${owed})">Record Payment</button>
                </td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('totalOutstanding').innerText = Math.round(Number(total)).toLocaleString();
    }

    function viewInvoice(id) {
        window.open(`/api/sales/${id}/receipt/`, '_blank', 'noopener');
    }

    // Records money received against a credit sale — the same Transaction the
    // Credit Follow-up screen writes, so both screens agree on what is owed.
    async function recordPayment(id, customer, outstanding) {
        const { value: form, isConfirmed } = await Swal.fire({
            title: `Record payment — ${customer}`,
            html: `
                <div class="text-start small text-muted mb-2">
                    Outstanding: <strong>TZS ${Math.round(outstanding).toLocaleString()}</strong>
                </div>
                <input id="payAmount" type="number" min="1" step="1" class="form-control mb-2"
                       placeholder="Amount received" value="${Math.round(outstanding)}">
                <select id="payMethod" class="form-select mb-2">
                    <option value="cash">Cash</option>
                    <option value="bank">Bank Transfer</option>
                    <option value="mobile">Mobile Money</option>
                </select>
                <input id="payRef" type="text" class="form-control" placeholder="Reference (optional)">`,
            showCancelButton: true,
            confirmButtonText: 'Record payment',
            preConfirm: () => {
                const amount = parseFloat(document.getElementById('payAmount').value);
                if (!amount || amount <= 0) {
                    Swal.showValidationMessage('Enter an amount greater than zero.');
                    return false;
                }
                return {
                    sale: id,
                    amount,
                    payment_method: document.getElementById('payMethod').value,
                    reference: document.getElementById('payRef').value
                };
            }
        });
        if (!isConfirmed || !form) return;

        try {
            const res = await fetch('/api/transactions/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF_TOKEN },
                body: JSON.stringify(form)
            });
            if (res.ok) {
                Swal.fire('Recorded', 'The payment has been recorded.', 'success');
                fetchCreditSales();
            } else {
                let msg = 'Failed to record the payment.';
                try { msg = (await res.json()).detail || msg; } catch (_) {}
                Swal.fire('Error', res.status === 403 ? "You don't have permission." : msg, 'error');
            }
        } catch (e) {
            console.error(e);
            Swal.fire('Error', 'Network error — please try again.', 'error');
        }
    }
</script>
{% endblock %}
