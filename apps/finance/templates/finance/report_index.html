{% extends "finance/accounting_base.html" %}
{% block content %}
<div class="row g-3">
  {% for url, name, icon, desc in reports %}
  <div class="col-md-6 col-xl-4">
    <a href="{{ url }}" class="card h-100 text-decoration-none">
      <div class="card-body d-flex align-items-center gap-3">
        <i class="bi {{ icon }} text-primary" style="font-size: 1.8rem;"></i>
        <div><div class="fw-semibold text-dark">{{ name }}</div><div class="text-muted-sm">{{ desc }}</div></div>
      </div>
    </a>
  </div>
  {% endfor %}
</div>
{% endblock %}
