{% extends 'base.html' %}

{% block page_header %}
<div class="page-header">
    <div>
        <div class="eyebrow">Store Manager</div>
        <h2>Deliveries to Verify</h2>
        <p class="subtitle">Open each order on its own and check the items one by one.</p>
    </div>
    <button class="btn btn-secondary" onclick="loadPOs()"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
</div>
{% endblock %}

{% block content %}
<div id="poContainer">
    <div class="text-center py-5 text-muted">
        <div class="spinner-border text-primary"></div>
        <p class="mt-2">Loading confirmed orders…</p>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener('DOMContentLoaded', loadPOs);

    async function loadPOs() {
        const box = document.getElementById('poContainer');
        try {
            const res = await fetch('/api/purchase-orders/');
            const data = await res.json();
            const pos = (Array.isArray(data) ? data : data.results).filter(p => p.status === 'awaiting_check');
            box.innerHTML = '';

            if (!pos.length) {
                box.innerHTML = `<div class="card shadow-sm"><div class="card-body text-center text-muted py-5">
                    <i class="bi bi-check2-circle display-4 text-success opacity-50"></i>
                    <p class="mt-3 mb-0">No deliveries waiting for verification.</p></div></div>`;
                return;
            }

            const table = document.createElement('div');
            table.className = 'card shadow-sm';
            table.innerHTML = `
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="bg-light">
                                <tr>
                                    <th class="ps-4">PO #</th>
                                    <th>Supplier</th>
                                    <th>Branch</th>
                                    <th class="text-center">Items to check</th>
                                    <th>Delivery</th>
                                    <th class="text-end pe-4">Action</th>
                                </tr>
                            </thead>
                            <tbody>${pos.map(rowFor).join('')}</tbody>
                        </table>
                    </div>
                </div>`;
            box.appendChild(table);
        } catch (e) {
            console.error(e);
            box.innerHTML = '<div class="alert alert-danger">Failed to load orders.</div>';
        }
    }

    function rowFor(po) {
        // Only items still owed need checking — on a balance delivery the ones
        // already received are done with.
        const pending = (po.items || []).filter(it => (it.outstanding == null ? it.quantity : it.outstanding) > 0);
        const round = (po.checks || []).length + 1;
        const label = round > 1
            ? `<span class="badge bg-warning-subtle text-warning"><i class="bi bi-arrow-repeat"></i> Balance delivery (round ${round})</span>`
            : `<span class="badge bg-info-subtle text-info"><i class="bi bi-box-seam"></i> First delivery</span>`;

        return `
            <tr>
                <td class="ps-4 fw-bold">PO-${String(po.id).padStart(5, '0')}</td>
                <td class="fw-medium">${po.supplier_name || '—'}</td>
                <td><span class="badge bg-light text-dark border">${po.branch_name || '—'}</span></td>
                <td class="text-center">${pending.length}</td>
                <td>${label}</td>
                <td class="text-end pe-4">
                    <a href="/inventory/deliveries/verify/${po.id}/" class="btn btn-sm btn-primary">
                        <i class="bi bi-clipboard-check"></i> Open &amp; check
                    </a>
                </td>
            </tr>`;
    }
</script>
{% endblock %}
