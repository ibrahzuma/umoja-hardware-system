{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="text-primary fw-bold">Goods Received Notes (GRN)</h2>
    <a href="{% url 'inventory:grn_create' %}" class="btn btn-primary">
        <i class="bi bi-file-earmark-plus"></i> Create GRN
    </a>
</div>

<!-- GRN Table -->
<div class="card shadow-sm">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0" id="grnTable">
                <thead class="bg-light">
                    <tr>
                        <th class="ps-4">GRN #</th>
                        <th>Date</th>
                        <th>Receipt No</th>
                        <th>Branch</th>
                        <th>Created By</th>
                        <th>PO Ref</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="grnTableBody">
                    <tr>
                        <td colspan="7" class="text-center py-4">Loading GRNs...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        fetchGRNs();
    });

    async function fetchGRNs() {
        try {
            const response = await fetch('/api/grns/');
            const data = await response.json();
            renderTable(data);
        } catch (error) {
            console.error(error);
        }
    }

    function renderTable(data) {
        const tbody = document.getElementById('grnTableBody');
        tbody.innerHTML = '';

        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted">No GRNs found</td></tr>';
            return;
        }

        data.forEach(grn => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="ps-4 fw-bold">#${grn.id}</td>
                <td class="text-muted">${new Date(grn.received_date).toLocaleDateString()}</td>
                <td class="fw-medium">${grn.receipt_number}</td>
                <td><span class="badge bg-light text-dark border">${grn.branch_name || '-'}</span></td>
                <td><small>${grn.created_by_name || '-'}</small></td>
                <td>${grn.po_ref || '-'}</td>
                <td>
                    <button class="btn btn-sm btn-outline-primary" onclick="viewDetails(${grn.id})"><i class="bi bi-eye"></i></button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    async function viewDetails(id) {
        let grn;
        try { grn = await (await fetch(`/api/grns/${id}/`)).json(); }
        catch (e) { Swal.fire('Error', 'Could not load the GRN.', 'error'); return; }

        const rows = (grn.items || []).map(it => `
            <tr>
                <td style="text-align:left;">${it.product_name || it.product}</td>
                <td>${it.quantity_received}</td>
                <td style="text-align:left;">${it.remarks || ''}</td>
            </tr>`).join('');

        Swal.fire({
            title: `GRN #${grn.id}`,
            width: 640,
            html: `
                <div class="text-start small mb-2">
                    <div><strong>Receipt No:</strong> ${grn.receipt_number || '—'}</div>
                    <div><strong>Branch:</strong> ${grn.branch_name || '—'}</div>
                    <div><strong>Purchase order:</strong> ${grn.po_ref || '—'}</div>
                    <div><strong>Received:</strong> ${new Date(grn.received_date).toLocaleString()}
                        by ${grn.created_by_name || '—'}</div>
                </div>
                <table class="table table-sm" style="font-size:.85rem;">
                    <thead><tr><th style="text-align:left;">Product</th><th>Received</th>
                        <th style="text-align:left;">Remarks</th></tr></thead>
                    <tbody>${rows || '<tr><td colspan="3">No items recorded.</td></tr>'}</tbody>
                </table>
                ${grn.notes ? `<div class="text-start small"><strong>Notes:</strong> ${grn.notes}</div>` : ''}`,
            confirmButtonText: 'Close'
        });
    }
</script>
{% endblock %}
